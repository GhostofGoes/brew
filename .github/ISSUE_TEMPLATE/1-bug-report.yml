name: "Bug/Issue Report"
description: "Describe a bug, error, unexpected behavior, or other problem"
title: "[BUG] "
labels: ["bug"]
assignees: []
body:
  - type: dropdown
    attributes:
      label: Area
      description: "The part of the range that has the problem."
      options:
        - Range on a phenix host (a VM, the network, provisioning)
        - Process simulation (sim, HELICS federates)
        - PLC programs (OpenPLC)
        - SCADA, HMI, or BAS (FUXA)
        - SOC (Malcolm, Wazuh, sensors)
        - Remote access (WireGuard, Guacamole)
        - Images (phenix-images)
        - Tools (plantgen, netcheck, wangen, sync.py)
        - White-cell view (cm-viz)
        - CI, hooks, or the dev container
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Variant
      description: "The variant of the range, if the problem is in a range that runs."
      options:
        - ci
        - lite
        - full
        - multi-site (a site or the WAN)
        - N/A
  - type: input
    attributes:
      label: Commit
      description: "The commit of this repository (`git rev-parse HEAD`)."
      placeholder: "e.g., 0123abc"
    validations:
      required: true
  - type: input
    attributes:
      label: Host
      description: "For a range that runs: the host OS, its cores and memory, and the phenix and minimega versions or commits. Otherwise 'N/A'."
      placeholder: "e.g., Ubuntu 24.04, 64 cores, 512 GB, phenix abc1234, minimega 2.9"
  - type: textarea
    attributes:
      label: Description
      description: "A clear description of the problem, with what you expected to happen."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: "The commands or actions that show the problem."
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs and screenshots
      description: "Output of the failed command, `phenix` logs, the status of the `cherrymountain` app, or screenshots. Remove secrets first."
      render: text
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I have included no proprietary/sensitive information in my issue.
          required: true
        - label: I have searched the existing issues and believe this is not a duplicate.
          required: true
